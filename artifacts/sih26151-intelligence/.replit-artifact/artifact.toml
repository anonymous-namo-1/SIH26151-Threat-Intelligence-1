kind = "web"
previewPath = "/"
title = "ARGUS Investigation Platform"
description = "Evidence-led case management, entity correlation, explainable relationship graphs and investigation reporting for authorized research."
version = "1.0.0"
id = "artifacts/sih26151-intelligence"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/_next/hmr" ]
localPort = 24668

[services.development]
run = "pnpm --filter @workspace/sih26151-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sih26151-intelligence", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sih26151-intelligence", "run", "serve" ]

[services.env]
PORT = "24668"
BASE_PATH = "/"
