services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - argus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - argus-redis:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ARGUS_INTERNAL_PORT: "8002"
      ARGUS_ANALYSIS_WORKER: ${ARGUS_ANALYSIS_WORKER:-true}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8002"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      PORT: "5000"
      ARGUS_INTERNAL_HOST: api
      ARGUS_INTERNAL_PORT: "8002"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVATE_OBJECT_DIR: ${PRIVATE_OBJECT_DIR:-}
      PUBLIC_OBJECT_SEARCH_PATHS: ${PUBLIC_OBJECT_SEARCH_PATHS:-}
    depends_on:
      api:
        condition: service_started
    expose:
      - "5000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      PORT: "3000"
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
      CLERK_PROXY_URL: ${CLERK_PROXY_URL:-}
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:8088"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - web

volumes:
  argus-postgres:
  argus-redis:
