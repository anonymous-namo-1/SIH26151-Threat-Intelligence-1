openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: ARGUS lawful threat-intelligence investigation API
servers:
  - url: /api
tags:
  - { name: health }
  - { name: argus }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /argus/me:
    get:
      operationId: getMe
      tags: [argus]
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
  /argus/dashboard:
    get:
      operationId: getDashboard
      tags: [argus]
      responses:
        "200": { description: Visible case aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /argus/capabilities:
    get:
      operationId: getCapabilities
      tags: [argus]
      responses:
        "200": { description: Runtime capabilities, content: { application/json: { schema: { $ref: "#/components/schemas/Capabilities" } } } }
  /argus/cases:
    get:
      operationId: listCases
      tags: [argus]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CaseStatus" } }
      responses:
        "200": { description: Cases, content: { application/json: { schema: { $ref: "#/components/schemas/CasePage" } } } }
    post:
      operationId: createCase
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CaseInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
  /argus/cases/{case_id}:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: getCase
      tags: [argus]
      responses:
        "200": { description: Case, content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
    patch:
      operationId: updateCase
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CaseUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
    delete:
      operationId: deleteCase
      tags: [argus]
      responses:
        "204": { description: Deleted }
  /argus/search:
    get:
      operationId: searchIntelligence
      tags: [argus]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200": { description: Search results, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResults" } } } }
  /argus/cases/{case_id}/entities:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: listEntities
      tags: [argus]
      responses:
        "200": { description: Entities, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Entity" } } } } }
    post:
      operationId: createEntity
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EntityInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
  /argus/entities/{entity_id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    get:
      operationId: getEntity
      tags: [argus]
      responses:
        "200": { description: Entity, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
    patch:
      operationId: updateEntity
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EntityUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
  /argus/cases/{case_id}/relationships:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: listRelationships
      tags: [argus]
      responses:
        "200": { description: Relationships, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Relationship" } } } } }
    post:
      operationId: createRelationship
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RelationshipInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
  /argus/relationships/{relationship_id}:
    parameters: [{ $ref: "#/components/parameters/RelationshipId" }]
    patch:
      operationId: updateRelationship
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RelationshipUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
    delete:
      operationId: deleteRelationship
      tags: [argus]
      responses:
        "204": { description: Deleted }
  /argus/cases/{case_id}/graph:
    get:
      operationId: getCaseGraph
      tags: [argus]
      parameters:
        - { $ref: "#/components/parameters/CaseId" }
        - { name: min_confidence, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 0 } }
        - { name: entity_type, in: query, schema: { $ref: "#/components/schemas/EntityType" } }
        - { name: relationship_type, in: query, schema: { $ref: "#/components/schemas/RelationshipType" } }
      responses:
        "200": { description: Graph, content: { application/json: { schema: { $ref: "#/components/schemas/Graph" } } } }
  /argus/cases/{case_id}/path:
    get:
      operationId: findEntityPath
      tags: [argus]
      parameters:
        - { $ref: "#/components/parameters/CaseId" }
        - { name: source, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: target, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: min_confidence, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 0 } }
      responses:
        "200": { description: Shortest path, content: { application/json: { schema: { $ref: "#/components/schemas/GraphPath" } } } }
  /argus/cases/{case_id}/views:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: listSavedViews
      tags: [argus]
      responses:
        "200": { description: Views, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SavedView" } } } } }
    post:
      operationId: createSavedView
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SavedView" } } } }
  /argus/views/{view_id}:
    delete:
      operationId: deleteSavedView
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/ViewId" }]
      responses:
        "204": { description: Deleted }
  /argus/cases/{case_id}/evidence:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: listEvidence
      tags: [argus]
      responses:
        "200": { description: Evidence, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Evidence" } } } } }
    post:
      operationId: createEvidence
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Evidence" } } } }
  /argus/evidence/{evidence_id}:
    parameters: [{ $ref: "#/components/parameters/EvidenceId" }]
    get:
      operationId: getEvidence
      tags: [argus]
      responses:
        "200": { description: Evidence, content: { application/json: { schema: { $ref: "#/components/schemas/Evidence" } } } }
    patch:
      operationId: updateEvidence
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Evidence" } } } }
  /argus/cases/{case_id}/timeline:
    get:
      operationId: getCaseTimeline
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/CaseId" }]
      responses:
        "200": { description: Timeline, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimelineEvent" } } } } }
  /argus/cases/{case_id}/analyze:
    post:
      operationId: analyzeCase
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/CaseId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnalysisInput" } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
  /argus/jobs/{job_id}:
    get:
      operationId: getJob
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
  /argus/cases/{case_id}/jobs:
    get:
      operationId: listCaseJobs
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/CaseId" }]
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Job" } } } } }
  /argus/cases/{case_id}/compare:
    get:
      operationId: compareEntities
      tags: [argus]
      parameters:
        - { $ref: "#/components/parameters/CaseId" }
        - { name: left, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: right, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Explainable comparison, content: { application/json: { schema: { $ref: "#/components/schemas/EntityComparison" } } } }
  /argus/cases/{case_id}/reports:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: listReports
      tags: [argus]
      responses:
        "200": { description: Reports, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Report" } } } } }
    post:
      operationId: createReport
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReportInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
  /argus/reports/{report_id}:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      operationId: getReport
      tags: [argus]
      responses:
        "200": { description: Report, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
    patch:
      operationId: updateReport
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReportUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
    delete:
      operationId: deleteReport
      tags: [argus]
      responses:
        "204": { description: Deleted }
  /argus/reports/{report_id}/export:
    get:
      operationId: exportReport
      tags: [argus]
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { name: format, in: query, required: true, schema: { $ref: "#/components/schemas/ExportFormat" } }
      responses:
        "200": { description: Safe rendered report, content: { application/json: { schema: { $ref: "#/components/schemas/ReportExport" } } } }
  /argus/audit:
    get:
      operationId: listAuditEvents
      tags: [argus]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { name: case_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Audit events, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
  /argus/users:
    get:
      operationId: listUsers
      tags: [argus]
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
  /argus/users/{user_id}:
    patch:
      operationId: updateUser
      tags: [argus]
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /argus/uploads:
    post:
      operationId: createUploadTicket
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UploadInput" } } } }
      responses:
        "201": { description: Ticket, content: { application/json: { schema: { $ref: "#/components/schemas/UploadTicket" } } } }
  /argus/uploads/{upload_id}:
    get:
      operationId: getUploadTicket
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/UploadId" }]
      responses:
        "200": { description: Ticket, content: { application/json: { schema: { $ref: "#/components/schemas/UploadTicket" } } } }
  /argus/uploads/{upload_id}/finalize:
    post:
      operationId: finalizeUpload
      tags: [argus]
      parameters: [{ $ref: "#/components/parameters/UploadId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UploadFinalizeInput" } } } }
      responses:
        "201": { description: Evidence, content: { application/json: { schema: { $ref: "#/components/schemas/Evidence" } } } }
  /argus/seed:
    post:
      operationId: seedWorkspace
      tags: [argus]
      responses:
        "201": { description: Fictional investigation, content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
  /argus/cases/{case_id}/modules:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    post:
      operationId: runCaseModule
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleInput" } } } }
      responses:
        "200": { description: Cited reviewable analysis, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleResult" } } } }
  /argus/cases/{case_id}/scoring-rules:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      operationId: getScoringRules
      tags: [argus]
      responses:
        "200": { description: Current case scoring rules, content: { application/json: { schema: { $ref: "#/components/schemas/ScoringRules" } } } }
    put:
      operationId: saveScoringRules
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScoringRuleInput" } } } }
      responses:
        "200": { description: Versioned scoring rules, content: { application/json: { schema: { $ref: "#/components/schemas/ScoringRules" } } } }
  /argus/jobs/{job_id}/review:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      operationId: reviewAnalysisJob
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewInput" } } } }
      responses:
        "200": { description: Recorded investigator decisions, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
  /argus/cases/{case_id}/assistant:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    post:
      operationId: askCaseAssistant
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantInput" } } } }
      responses:
        "200": { description: Case-only cited draft, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantResult" } } } }
  /argus/cases/{case_id}/transactions/import:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    post:
      operationId: importTransactions
      tags: [argus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionImportInput" } } } }
      responses:
        "201": { description: Investigator-approved supplied transactions, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionImportResult" } } } }
components:
  parameters:
    CaseId: { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
    EntityId: { name: entity_id, in: path, required: true, schema: { type: string, format: uuid } }
    RelationshipId: { name: relationship_id, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenceId: { name: evidence_id, in: path, required: true, schema: { type: string, format: uuid } }
    ReportId: { name: report_id, in: path, required: true, schema: { type: string, format: uuid } }
    ViewId: { name: view_id, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: upload_id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  schemas:
    ModuleName:
      type: string
      enum: [persona, stylometry, temporal, wallet, infrastructure, alias, relationship, reliability, contradiction, timeline]
    ModuleInput:
      type: object
      required: [module]
      properties:
        module: { $ref: "#/components/schemas/ModuleName" }
        left_id: { type: string, format: uuid }
        right_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        corpus_left: { type: string, maxLength: 50000 }
        corpus_right: { type: string, maxLength: 50000 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    AnalysisFactor:
      type: object
      required: [name, status, score, weight, contribution, reason, evidence_ids]
      properties:
        name: { type: string }
        status: { type: string }
        score: { type: [number, "null"] }
        weight: { type: number }
        contribution: { type: number }
        reason: { type: string }
        evidence_ids: { type: array, items: { type: string } }
    ModuleResult:
      type: object
      required: [module, model_version, generated_at, explanation, evidence_ids, confidence, positive_evidence, negative_evidence, unknown_factors, data]
      properties:
        job_id: { type: string, format: uuid }
        module: { $ref: "#/components/schemas/ModuleName" }
        model_version: { type: string }
        generated_at: { type: string, format: date-time }
        explanation: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        confidence: { type: [number, "null"], minimum: 0, maximum: 100 }
        positive_evidence: { type: array, items: { $ref: "#/components/schemas/AnalysisFactor" } }
        negative_evidence: { type: array, items: { $ref: "#/components/schemas/AnalysisFactor" } }
        unknown_factors: { type: array, items: { type: string } }
        data: { type: object, additionalProperties: {} }
    ScoringRuleInput:
      type: object
      required: [weights]
      properties:
        weights: { type: object, additionalProperties: { type: number, minimum: -50, maximum: 50 } }
    ScoringRules:
      type: object
      required: [weights, model_version, updated_at]
      properties:
        weights: { type: object, additionalProperties: { type: number } }
        model_version: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    ReviewDecision:
      type: object
      required: [candidate_id, action]
      properties:
        candidate_id: { type: string }
        action: { type: string, enum: [accept, reject] }
        type: { type: string }
        value: { type: string, minLength: 1, maxLength: 2000 }
        explanation: { type: string, maxLength: 10000 }
    ReviewInput:
      type: object
      required: [decisions]
      properties:
        decisions: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/ReviewDecision" } }
    AssistantInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
    AssistantFinding:
      type: object
      required: [text, evidence_ids]
      properties:
        text: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        quotes: { type: array, items: { type: object, required: [evidence_id, quote], properties: { evidence_id: { type: string }, quote: { type: string } } } }
    AssistantResult:
      type: object
      required: [status, answer, findings, evidence_ids, uncertainties, model_version, generated_at]
      properties:
        status: { type: string }
        answer: { type: string }
        findings: { type: array, items: { $ref: "#/components/schemas/AssistantFinding" } }
        evidence_ids: { type: array, items: { type: string } }
        uncertainties: { type: array, items: { type: string } }
        model_version: { type: string }
        generated_at: { type: string, format: date-time }
    TransactionRecord:
      type: object
      required: [hash, from_address, to_address, amount, asset, timestamp]
      properties:
        hash: { type: string, minLength: 1, maxLength: 256 }
        from_address: { type: string, minLength: 1, maxLength: 256 }
        to_address: { type: string, minLength: 1, maxLength: 256 }
        amount: { type: string, pattern: "^\\d{1,30}(\\.\\d{1,18})?$" }
        asset: { type: string, minLength: 1, maxLength: 30 }
        timestamp: { type: string, format: date-time }
        labels: { type: array, maxItems: 20, items: { type: string } }
    TransactionImportInput:
      type: object
      required: [evidence_id, transactions]
      properties:
        evidence_id: { type: string, format: uuid }
        transactions: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/TransactionRecord" } }
    TransactionImportResult:
      type: object
      required: [created, existing, entity_ids]
      properties:
        created: { type: integer }
        existing: { type: integer }
        entity_ids: { type: array, items: { type: string, format: uuid } }
    ActivitySummary:
      type: object
      required: [id, case_id, action, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        action: { type: string }
        created_at: { type: string, format: date-time }
    CorrelationSummary:
      type: object
      required: [job_id, case_id, confidence, explanation, generated_at]
      properties:
        job_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        confidence: { type: number }
        explanation: { type: string }
        generated_at: { type: string, format: date-time }
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Role: { type: string, enum: [ADMIN, LEAD_INVESTIGATOR, INVESTIGATOR, ANALYST, VIEWER] }
    CaseStatus: { type: string, enum: [OPEN, INVESTIGATING, REVIEW_REQUIRED, CLOSED, ARCHIVED] }
    Priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    Classification: { type: string, enum: [UNCLASSIFIED, RESTRICTED, CONFIDENTIAL] }
